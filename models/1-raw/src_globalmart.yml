version: 2

sources: 
  - name: globalmart
    description: a clone of the snowflake db
    database: raw
    schema: globalmart
    tables:
        - name: customer
          description: list of all customers in source system
          columns:
          - name: customerid
            description: unique identifier of the product
            tests:
              - unique
              - not_null
        - name: orders
          description: list of all orders in source system
          columns:
          - name: orderid
            description: unique identifier of the order
            tests:
              - unique
              - not_null
          config:
            freshness:
              error_after:
                count: 15
                period: minute
        - name: product
          description: list of all products in source system
          columns:
          - name: productid
            description: unique identifier of the product
            tests:
              - unique
              - not_null